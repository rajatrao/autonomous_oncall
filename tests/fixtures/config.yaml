config_version: "1"
organization: {name: test-org}
state: {backend: sqlite, url: "${ONCALL_TEST_DB:-/tmp/oncall-test.db}"}
integrations:
  observability: {provider: mock, fixture: "${ONCALL_FIXTURE}"}
  logs: {provider: mock, fixture: "${ONCALL_FIXTURE}"}
  traces: {provider: none}
  changes: {provider: mock, fixture: "${ONCALL_FIXTURE}"}
  remediation: {provider: mock, fixture: "${ONCALL_FIXTURE}"}
  communications: {provider: log}
  knowledge: {provider: filesystem, runbooks_dir: "${ONCALL_RUNBOOKS:-tests/fixtures/runbooks}"}
autonomy:
  mode: autonomous
  remediation: {default: approval_required, failover: "${ONCALL_FAILOVER_MODE:-automatic}", rollback: automatic}
remediation:
  allowed_services: ["*"]
  failover_targets:
    geo-provider-a: [geo-provider-b]
  min_confidence: 0.8
runner:
  type: "${ONCALL_RUNNER:-none}"
  agent_ref: "${ONCALL_AGENT_REF:-dist/oncall-agent.yaml}"
  api_url: "${ONCALL_AGENT_API:-http://127.0.0.1:8080}"
  agent_id: oncall-agent
  binary: "${ONCALL_DOCKER_AGENT:-docker-agent}"
  flavors: [scripted-model]
  extra_args: ["--data-dir", "${ONCALL_DA_DATA:-/tmp/da-data}"]
  timeout_seconds: 600
  max_attempts: 3
  retry_backoff_seconds: 1
  concurrency: 4
gateway:
  followup_seconds: 0
# Decision model: off unless a test turns it on. The mock provider answers deterministically;
# ONCALL_JEV_MOCK_FAIL=timeout|unavailable|rejected|garbage simulates a broken provider.
decisions:
  enabled: "${ONCALL_JEV_ENABLED:-false}"
  provider: {type: "${ONCALL_JEV_PROVIDER:-mock}", url: "${ONCALL_JEV_URL:-}", model: "${ONCALL_JEV_MODEL:-}",
             fail: "${ONCALL_JEV_MOCK_FAIL:-}"}
  default_mode: "${ONCALL_JEV_MODE:-shadow}"
  enabled_decisions: "${ONCALL_JEV_DECISIONS:-runbook_selection,diagnosis_category,severity,evidence_sufficiency,remediation_consistency}"
  fallback: "${ONCALL_JEV_FALLBACK:-baseline}"
  per_decision:
    runbook_selection: {min_confidence: "${ONCALL_JEV_MIN_CONFIDENCE:-}"}
    diagnosis_category: {min_confidence: "${ONCALL_JEV_MIN_CONFIDENCE:-}"}
    evidence_sufficiency: {min_confidence: "${ONCALL_JEV_MIN_CONFIDENCE:-}"}
    remediation_consistency: {min_confidence: "${ONCALL_JEV_MIN_CONFIDENCE:-}"}
