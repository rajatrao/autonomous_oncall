service_health:
  checkout-api:
    status: critical
    signals:
      error_rate: {current: 0.22, peak: 0.24, baseline: 0.004, shape: sustained, onset: "now-10m", threshold: 0.05}
    error_rate_by_version: {"3.3.0": 0.22}
dependency_health:
  checkout-api:
    - dependency: geo-provider-a
      status: healthy
      error_rate: {current: 0.002, peak: 0.004, baseline: 0.002, shape: normal}
    - dependency: geo-provider-b
      status: healthy
      error_rate: {current: 0.0, peak: 0.0, baseline: 0.0, shape: normal}
error_signatures:
  checkout-api:
    - signature: "TypeError in PriceFormatter.format: unsupported currency <n>"
      count: 240
      baseline_count: 0
      new: true
      context: {component: PriceFormatter, version: "3.3.0"}
deployments:
  checkout-api:
    - {at: "now-11m", service: checkout-api, kind: deployment, from: "3.2.0", to: "3.3.0", actor: ci}
config_changes:
  checkout-api: []
feature_flag_changes:
  checkout-api: []
capabilities:
  checkout-api:
    operations: [rollback_deployment, restart_service]
    deployments: [{version: "3.3.0", current: true}, {version: "3.2.0", healthy: true}]
after_actions:
  rollback_deployment:
    service_health:
      checkout-api:
        status: healthy
        signals:
          error_rate: {current: 0.004, peak: 0.24, baseline: 0.004, shape: recovered, threshold: 0.05}
