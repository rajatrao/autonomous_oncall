name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOCKER_AGENT_VERSION: "1.149.0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: oncall_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      ONCALL_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/oncall_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Install docker-agent (pinned)
        run: |
          docker create --name da docker/docker-agent:${DOCKER_AGENT_VERSION}
          docker cp da:/docker-agent /usr/local/bin/docker-agent
          docker rm da
          docker-agent version
      - name: Build and validate the agent definition
        run: ./scripts/build.sh agent
        env: {DOCKER_AGENT: docker-agent}
      - name: Tests (including agent behaviour through the real docker-agent)
        run: ./scripts/test.sh --agent -v
        env: {TELEMETRY_ENABLED: "false"}

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, images]
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install docker-agent (pinned)
        run: |
          docker create --name da docker/docker-agent:${DOCKER_AGENT_VERSION}
          docker cp da:/docker-agent /usr/local/bin/docker-agent
          docker rm da
      - name: Release
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          DOCKER_AGENT: docker-agent
          SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}" --push
