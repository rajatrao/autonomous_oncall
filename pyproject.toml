[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-oncall"
version = "0.1.0"
description = "Vendor-neutral autonomous on-call incident response agent for Docker Agent"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.29", "redis>=5", "psycopg[binary]>=3.1", "prometheus-client>=0.20"]
mcp = ["mcp>=2.3,<3", "uvicorn>=0.29", "psycopg[binary]>=3.1"]
scripted-model = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.29", "redis>=5", "psycopg[binary]>=3.1", "prometheus-client>=0.20", "mcp>=2.3,<3"]

[project.scripts]
oncall-gateway = "oncall_gateway.__main__:main"
oncall-mcp = "oncall_mcp.__main__:main"
oncall-scripted-model = "oncall_testing.scripted_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker_agent: needs the docker-agent binary (skipped when it is not installed)",
  "postgres: needs ONCALL_TEST_POSTGRES_URL",
  "ollama: needs a local Ollama with a decision model (ONCALL_TEST_OLLAMA_URL)",
]
