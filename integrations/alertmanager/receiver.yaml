# Alertmanager: route alerts to the on-call gateway.
# Labels the adapter understands: service (or job), severity (critical|warning|info) or
# oncall_severity (SEV1-5), environment, incident_id. Re-notifications of the same alert map to the
# same incident; resolved alerts become incident.recovery_detected.
route:
  receiver: oncall-agent
  group_by: [alertname, service]
  repeat_interval: 30m
receivers:
  - name: oncall-agent
    webhook_configs:
      - url: https://oncall-gateway.internal/v1/adapters/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/oncall-ingest-token
